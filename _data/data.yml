  intro: >
    Accomplished in bridging the gap between machine learning research and production-grade applications. 
    Proven track record in implementing high-performance models (CV/RL) and architecting scalable 
    data pipelines using FastAPI, Docker, and hybrid Cloud/Local environments.
  assignments:
  - title: Real-time Anomaly Detection & Service Migration
    link: "https://github.com/ark0723/anomaly_detection"
    tagline: "End-to-end ML workflow: Developed initial models on Azure Databricks and re-engineered the deployment pipeline to a local FastAPI environment."

  - title: Neural Style Transfer - Research Paper Implementation
    link: "https://github.com/ark0723/neural-style-transfer"
    tagline: "Full reproduction of Gatys et al. (CVPR 2016) with VGG19-based pipeline; achieved 6x faster convergence with L-BFGS."

