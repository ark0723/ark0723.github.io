projects:
  title: Projects
  intro: >
    Technical implementations bridging ML research and production-grade applications.
  assignments:
  - title: Signal Matrix — Automated Equity Screening Pipeline
    link: "https://github.com/ark0723/signal-matrix"
    tagline: "Designed and backtested multi-factor swing-trading screeners (MA/RSI/volume, EPS, candlestick patterns) across 500+ S&P 500 equities using vectorbt (2020–2024); operationalized into a production daily pipeline with FRED macro integration, GitHub Actions automation, Telegram alerts, and a FastAPI member API (Clerk JWT). Public sanpshot: ahlako.me/signal-matrix"
  - title: Real-time Anomaly Detection & Service Migration
    link: "https://github.com/ark0723/anomaly_detection"
    tagline: "End-to-end ML workflow: Developed initial models on Azure Databricks and re-engineered the deployment pipeline to a local FastAPI environment."

  - title: AI-Powered Custom Apparel Platform (MVP)
    link: "https://github.com/ark0723/aif_deployment"
    tagline: "Built the backend and AI integration layer for an e-commerce MVP; integrated generative AI APIs into a microservices-based architecture."

  - title: Binance MCP Server
    link: "https://github.com/ark0723/mcp_from_scratch"
    tagline: "Built a real-time cryptocurrency data server using FastMCP (Model Context Protocol); supports live price lookup, 24hr change tracking, and rolling window analytics via both STDIO and HTTP transports."

  - title: OpenPose for Medical Patient Analysis
    link: "https://github.com/ark0723/MyProject/tree/master/OpenPose"
    tagline: "Applied OpenPose to extract patient skeletal keypoints for clinical movement analysis, enabling quantitative assessment of physical rehabilitation progress."

  

