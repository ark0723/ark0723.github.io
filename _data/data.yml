projects:
  title: Projects
  intro: >
    Technical implementations bridging ML research and production-grade applications.
  assignments:
  - title: Signal Matrix — Automated Equity Screening Pipeline
    link: "https://github.com/ark0723/signal-matrix"
    tagline: "Designed and implemented a production-ready quantitative investment platform that automates daily equity screening across more than 500 S&P 500 companies. Combined technical, momentum, fundamental, and macroeconomic signals with automated data pipelines, Telegram notifications, and authenticated APIs to support systematic investment research."
    Tech: PostgreSQL | FastAPI | vectorbt | GitHub Actions | Pandas | Plotly | Clerk | Telegram Bot
    
  - title: Real-time Anomaly Detection & Service Migration
    link: "https://github.com/ark0723/anomaly_detection"
    tagline: "Developed anomaly detection models on Azure Databricks with MLflow model management; re-engineered deployment to a local FastAPI server with a Streamlit web interface for real-time image prediction."
    Tech: Azure Databricks | MLflow | FastAPI | Streamlit | Pytorch
    
  - title: AI-Powered Custom Apparel Platform (MVP)
    link: "https://github.com/ark0723/aif_deployment"
    tagline: "Built the backend for a custom t-shirt generation service transforming user keywords into AI-generated designs; architected a microservices backend (FastAPI + Django + Nginx) with Docker Compose, JWT authentication, and AWS S3 for image storage."
    Tech: FastAPI | Django | Docker Compose | Nginx | JWT | AWS S3 | AWS EC2 | Prompt Engineering
    
  - title: Binance MCP Server
    link: "https://github.com/ark0723/mcp_from_scratch"
    tagline: "Implemented an MCP-compatible cryptocurrency data server using FastMCP.Supports both STDIO and HTTP transports while exposing reusable tools for AI agents, including real-time market data retrieval and rolling analytics.Built primarily to explore the Model Context Protocol ecosystem and AI agent integration patterns."
    Tech: FastMCP | Model Context Protocol
  

