career-profile:
  title: Career Profile
  summary: |
    Data systems specialist focused on integrating Deep Learning, Reinforcement Learning, and 
    Operations Research to solve complex decision-making problems. Experienced in managing 
    end-to-end machine learning workflows—from data digitization and ETL processes to model 
    deployment. Adept at translating research methodologies into functional tools, with 
    practical experience in re-engineering deployment pipelines to ensure cost-efficient 
    operations across both cloud and local environments. Proven ability to deliver data-driven 
    solutions in healthcare and defense sectors that balance clinical utility with real-world 
    operational constraints.

education:
  title: Education
  info:
    - degree: Ph.D. in Industrial Engineering
      university: University of Arkansas
      time: 2018 - 2026
      details: |
        Dissertation: "From Data Digitization to Personalized Care: Deep Learning and Decision Analytics in Healthcare Systems"
        - Designed an automated OCR pipeline (YOLO/CRNN) and MDP-based treatment optimization models for complex clinical data.
        - Applied Deep Reinforcement Learning (PPO) and Computer Vision to enhance long-term patient outcomes and operational efficiency.
        - Integrated statistical sensitivity analysis and explainable AI (SHAP) to improve the interpretability of decision-support frameworks.
    - degree: BSc in Chemistry Education 
      university: Pusan National University
      time: 2007 - 2011
      details: |
        - Completed a curriculum focused on analytical chemistry and quantitative scientific methodologies.
        - Developed fundamental skills in experimental design, data collection, and laboratory management.
        - Built communication skills to present complex scientific concepts to diverse audiences.

experiences:
  title: Professional Experiences
  info:
    - role: Graduate Research Assistant & Lead Developer
      time: 2018 - Present
      company: University of Arkansas
      details: |
        [Preventive Breast Cancer: Multi-Modal Prevention Strategy Optimization]
        - Engineered a comprehensive decision-support framework to optimize multi-modal prevention strategies.
        - Achieved substantial clinical utility gains (2.33–4.33 QALY improvements).
        - Utilized SHAP (Explainable AI) to deconstruct policy network decision logic.
        [Metastatic Breast Cancer (mBC): Strategic Treatment & Sensitivity Analytics]
        - Formulated a multi-stage treatment decision process into a Markov Decision Process (MDP).
        - Developed a custom Gymnasium-based reinforcement learning environment.
        [Medical Form Digitization: AI-Driven Healthcare Automation]
        - Engineered an end-to-end OCR pipeline (YOLOv11 + Residual CRNN) achieving 99.67% accuracy.

    - role: Back-end Developer (Early Team)
      time: 2021 - 2021
      company: Heroworks, Busan (South Korea)
      details: |
        Joined as an early engineer for "DatAmenity," a domestic Revenue Management System (RMS).
        - Developed core web application and JSON APIs for real-time pricing across 20+ OTA platforms.
        - Architected relational database schemas (PostgreSQL + SQLAlchemy).
        - Built interactive dashboards and automated reporting systems using Flask.

    - role: Research Analyst (Assistant Researcher)
      time: 2016 - 2017
      company: Korea Institute for Defense Analysis (KIDA), Seoul, South Korea
      details: |
        Applied mathematical optimization and quantitative analysis for national defense projects.
        - Developed a location optimization model for military gunnery ranges.
        - Synthesized and standardized multi-source defense data for ROK-U.S. cost-sharing negotiations.
        - Orchestrated systematic collection and preprocessing of raw datasets.

