career-profile:
  title: Career Profile
  summary: |
    Data systems specialist focused on integrating Deep Learning, Reinforcement Learning, and 
    Operations Research to solve complex decision-making problems. Experienced in managing 
    end-to-end machine learning workflows—from data digitization and ETL processes to model 
    deployment. Adept at translating research methodologies into functional tools, with 
    practical experience in re-engineering deployment pipelines to ensure cost-efficient 
    operations across both cloud and local environments. Proven ability to deliver data-driven 
    solutions in healthcare and defense sectors that balance clinical utility with real-world 
    operational constraints.
education:
  title: Education
  info:
  - degree: Ph.D. in Industrial Engineering
    university: University of Arkansas
    time: 2018 - 2026
    details: |
      Dissertation: "From Data Digitization to Personalized Care: Deep Learning and Decision Analytics in Healthcare Systems"
        - Designed an automated OCR pipeline (YOLO/CRNN) and MDP-based treatment optimization models for complex clinical data.
        - Applied Deep Reinforcement Learning (PPO) and Computer Vision to enhance long-term patient outcomes and operational efficiency.
        - Integrated statistical sensitivity analysis and explainable AI (SHAP) to improve the interpretability of decision-support frameworks.
  - degree: BSc in Chemistry Education 
    university: Pusan National University
    time: 2007 - 2011
    details: |
      - Completed a curriculum focused on analytical chemistry and quantitative scientific methodologies.
      - Developed fundamental skills in experimental design, data collection, and laboratory management.
      - Built communication skills to present complex scientific concepts to diverse audiences.
      
experiences:
  title: Professional Experiences
  info:
  - role: Graduate Research Assistant & Lead Developer
    time: 2018 - Present
    company: University of Arkansas
    details: |
      [Preventive Breast Cancer: Multi-Modal Prevention Strategy Optimization]
      - Engineered a comprehensive decision-support framework to optimize multi-modal prevention strategies, including RRM, RRSO, Chemoprevention, and individualized surveillance.
      - Achieved substantial clinical utility gains, delivering 2.33–4.33 QALY (Quality-Adjusted Life Years) improvements over current standardized clinical guidelines for high-risk cohorts (BRCA1, BRCA2, PALB2).
      - Conducted Comparative Utility Analysis against extreme strategies (e.g., Earliest-RRM), demonstrating a 1.31–1.45 QALY advantage by identifying the optimal "Timing of Action" rather than uniform surgical intervention.
      - Utilized SHAP (Explainable AI) to deconstruct the policy network's decision logic, quantifying the influence of age-specific menopausal status and MRI-elapsed time on high-stakes surgical recommendations.
      - Validated model robustness through actuarial terminal value discounting and reward boundedness checks, ensuring the transition from MRI to Mammography (e.g., at age 55 for BRCA2) aligns with long-term survival maximization.

      [Metastatic Breast Cancer (mBC): Strategic Treatment & Sensitivity Analytics]
      - Formulated a multi-stage treatment decision process into a Markov Decision Process (MDP) to optimize quarterly therapy transitions and clinical stability.
      - Developed a custom Gymnasium-based reinforcement learning environment to simulate trade-offs between treatment efficacy (OS/QALY) and patient-specific quality-of-life.
      - Executed **Tornado Analysis (One-way Sensitivity Analysis)** to quantify the impact of clinical parameters and transition probabilities, identifying key drivers of optimal policy robustness.
      - Optimized **Cessation Timing** strategies by identifying evidence-based thresholds for transitioning from active line-therapy to Best Supportive Care (BSC), balancing survival gains against treatment toxicity.
      - Identified optimal "Tipping Points" to determine patient-centered thresholds for treatment escalation or de-escalation based on molecular subtypes (HR+, HER2+, TNBC).
      - Automated complex sensitivity reporting and policy mapping, providing a scalable framework for rapid adaptation to evolving clinical evidence and patient preferences.

      [Medical Form Digitization: AI-Driven Healthcare Automation]
      - Engineered an end-to-end OCR pipeline (YOLOv11 + Residual CRNN) for medical record digitization, achieving 99.67% accuracy (EMA) and reducing manual processing costs by over 90%.
      - Established a "Human-in-the-Loop" validation system with an optimal confidence threshold (-0.5721), automating 91% of total data entries while maintaining a clinical-grade error rate below 0.2%.
      - Implemented deterministic audit trails and rule-based consistency checks to ensure HIPAA-compliant data governance and traceability.
      
      
  - role: Back-end developer (early team)
  time: 2021 - 2021
  company: Heroworks, Busan(South Korea)
  details: |
      Joined as an early engineer for "DatAmenity," a domestic Revenue Management System (RMS) providing automated data-driven insights for the hospitality industry.
      - Developed and optimized the core web application and JSON APIs, enabling hotel operators to monitor real-time pricing and inventory parity across 20+ major OTA platforms.
      - Architected and managed relational database schemas (PostgreSQL + SQLAlchemy) to integrate large-scale pricing, room-type mapping, and competitive market data.
      - Built interactive data visualization dashboards and automated reporting systems using Flask, transforming complex raw data into actionable revenue management signals for end-users.
      - Implemented core business logic for rate comparison and market trend analysis, improving operational efficiency for hotel staff by centralizing cross-platform data.
      - Collaborated with data collection teams to bridge the gap between backend storage and customer-facing analytics, ensuring high data accessibility and user-friendly interface.

    
  - role: Research Analyst (Assistant Researcher)
    time: 2016 - 2017
    company: Korea Institute for Defense Analysis (KIDA), Seoul, South Korea
    details: |
      Applied mathematical optimization and quantitative analysis to support strategic decision-making for national defense projects.
      - Developed a location optimization model for military gunnery ranges, evaluating complex operational requirements against geographical and environmental constraints.
      - Synthesized and standardized multi-source defense data to support ROK-U.S. cost-sharing negotiations, ensuring high data reliability for strategy formulation.
      - Orchestrated the systematic collection and preprocessing of raw datasets to streamline research reporting and senior-level policy presentations.
      - Liaised with Ministry of National Defense officials to coordinate data-driven project milestones and ensure cross-departmental information alignment.

